<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mapa de Santa Fe con filtros de partidos</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; }
    .button-container { margin: 10px; }
    button { margin: 0 5px; padding: 5px 10px; }
  </style>
</head>
<body>

  <h1>Votos por departamento - Santa Fe</h1>
  <div class="button-container">
    <button onclick="updateMap('partido1')">Partido 1</button>
    <button onclick="updateMap('partido2')">Partido 2</button>
  </div>

  <svg id="mapa" width="800" height="600"></svg>

  <script>
    const svg = d3.select("#mapa");
    const width = +svg.attr("width");
    const height = +svg.attr("height");

    const projection = d3.geoMercator()
      .scale(4000)
      .center([-61, -32.5])
      .translate([width / 2, height / 2]);

    const path = d3.geoPath().projection(projection);

    const votos = {
      "9 de Julio":    { partido1: 1200, partido2: 800 },
      "Belgrano":      { partido1: 2300, partido2: 1900 },
      "Caseros":       { partido1: 1600, partido2: 2100 },
      "Castellanos":   { partido1: 3000, partido2: 2500 },
      "General Obligado": { partido1: 1100, partido2: 1700 },
      "San Justo":     { partido1: 900, partido2: 2000 },
    };

    let geojsonData;

    d3.json("departamentos.geojson").then(data => {
      geojsonData = data;

      // Agregar los votos
      geojsonData.features.forEach(d => {
        const nombre = d.properties.NOMBRE;
        if (votos[nombre]) {
          d.properties.votos_partido1 = votos[nombre].partido1;
          d.properties.votos_partido2 = votos[nombre].partido2;
        } else {
          d.properties.votos_partido1 = 0;
          d.properties.votos_partido2 = 0;
        }
      });

      drawMap("partido1");
    }).catch(err => {
      console.error("Error al cargar el GeoJSON:", err);
    });

    function drawMap(partido) {
      const color = d3.scaleSequential()
        .interpolator(d3.interpolateBlues)
        .domain([0, d3.max(geojsonData.features, d => d.properties[`votos_${partido}`])]);

      const departamentos = svg.selectAll("path")
        .data(geojsonData.features);

      departamentos.enter()
        .append("path")
        .attr("d", path)
        .attr("stroke", "#000")
        .attr("stroke-width", 0.5)
        .attr("fill", d => color(d.properties[`votos_${partido}`]))
        .append("title")
        .text(d => `${d.properties.NOMBRE}: ${d.properties[`votos_${partido}`]} votos`);

      departamentos.transition()
        .duration(500)
        .attr("fill", d => color(d.properties[`votos_${partido}`]));

      departamentos.select("title")
        .text(d => `${d.properties.NOMBRE}: ${d.properties[`votos_${partido}`]} votos`);
    }

    function updateMap(partido) {
      drawMap(partido);
    }
  </script>
</body>
</html>
